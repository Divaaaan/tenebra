[package]
name = "tenebra-desktop"
version = "0.1.0"
description = "Tenebra desktop client"
authors = ["Tenebra contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tenebra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
