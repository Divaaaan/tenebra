[package]
name = "tenebra-desktop"
version = "0.5.10"
description = "Tenebra desktop client"
authors = ["Tenebra contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tenebra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
# The deep-link feature makes the single-instance callback forward a second
# launch's CLI arguments to the deep-link plugin, so a `tenebra://` link opened
# while the app is already running reaches the primary instance.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Robustly parse incoming tenebra:// deep links (scheme, host verb, decoded
# query params). Already in the tree via tauri; pinned here as a direct use.
url = "2"
# Open the crash-report GitHub URL in the user's default browser from a Rust
# command, so the webview needs no shell:open capability (it stays denied — see
# capabilities/default.json) and cannot influence the destination host. Already
# in the tree via tauri-plugin-shell; pinned here as a direct use.
open = "5"

[target.'cfg(windows)'.dependencies]
# Raw Win32 declarations for the named-pipe transport: PeekNamedPipe lets the
# client poll a synchronous pipe handle without wedging writes (see
# backend/pipe.rs), and the tests stand up an in-process pipe server with
# CreateNamedPipeW/ConnectNamedPipe. Already in the tree via tauri; pinned here
# as a direct use.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
