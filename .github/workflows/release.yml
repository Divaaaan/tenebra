name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Gate the release on the full CI suite so a tag can never point at an
  # untested commit: the signed build below only runs once these pass.
  ci:
    uses: ./.github/workflows/ci.yml
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify the version files match the tag
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME" --check
  windows:
    needs: [ci, version-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch sing-box and wintun
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-resources.ps1
      - name: Build core sidecar
        run: go build -o ui-desktop/src-tauri/binaries/tenebra-core-x86_64-pc-windows-msvc.exe ./cmd/tenebra-core
      - name: Install front-end dependencies
        working-directory: ui-desktop
        run: npm ci
      - name: Build, sign, and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui-desktop
          tagName: ${{ github.ref_name }}
          releaseName: Tenebra ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # --locked makes a stale Cargo.lock fail the build instead of silently
          # resolving new versions, so a signed release always matches the lockfile.
          args: --bundles nsis -- --locked
          releaseBody: |
            Windows desktop build of Tenebra.

            The installer is unsigned — Windows SmartScreen will warn on first
            install (More info -> Run anyway). From this version on, updates are
            delivered in-app (Settings -> Updates) and verified against the
            project's signing key before they install.
