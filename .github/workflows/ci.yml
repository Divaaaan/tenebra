name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-desktop/package-lock.json
      - name: Install front-end dependencies
        working-directory: ui-desktop
        run: npm ci
      - name: Type-check
        working-directory: ui-desktop
        run: npm run typecheck
      - name: Run front-end tests
        working-directory: ui-desktop
        run: npm test
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch sing-box and wintun
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-resources.ps1
      - name: Build core sidecar
        run: go build -o ui-desktop/src-tauri/binaries/tenebra-core-x86_64-pc-windows-msvc.exe ./cmd/tenebra-core
      - name: Test the Rust backend
        working-directory: ui-desktop/src-tauri
        run: cargo test --all-targets
      - name: Install front-end dependencies
        working-directory: ui-desktop
        run: npm ci
      - name: Build the installer
        working-directory: ui-desktop
        env:
          # createUpdaterArtifacts is on, so the build signs the installer and
          # needs the key here too — not just in the release workflow.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v6
        with:
          name: tenebra-windows-installer
          path: ui-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
