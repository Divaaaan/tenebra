name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-desktop/package-lock.json
      - name: Check the version files agree
        run: node scripts/set-version.mjs --check
      - name: Install front-end dependencies
        working-directory: ui-desktop
        run: npm ci
      - name: Type-check
        working-directory: ui-desktop
        run: npm run typecheck
      - name: Lint
        working-directory: ui-desktop
        run: npm run lint
      - name: Run front-end tests
        working-directory: ui-desktop
        run: npm test
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        working-directory: ui-desktop/src-tauri
        run: cargo fmt --check
      - name: Fetch sing-box and wintun
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-resources.ps1
      - name: Build core sidecar
        run: go build -o ui-desktop/src-tauri/binaries/tenebra-core-x86_64-pc-windows-msvc.exe ./cmd/tenebra-core
      - name: Lint the Rust backend
        working-directory: ui-desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test the Rust backend
        working-directory: ui-desktop/src-tauri
        run: cargo test --all-targets
      - name: Install front-end dependencies
        working-directory: ui-desktop
        run: npm ci
      - name: Build the installer
        working-directory: ui-desktop
        # CI only needs to prove the installer builds. It overrides the bundle
        # config to skip updater artifacts, so the release signing key is never
        # exposed to routine push and pull-request builds — the tagged release
        # workflow is the only place that signs.
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v6
        with:
          name: tenebra-windows-installer
          path: ui-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
  macos:
    # Proves the Go core plus the darwin-tagged macOS adapter (adapters/macos)
    # compile and pass their tests on a real Apple Silicon runner — the macOS
    # files are gated on `//go:build darwin`, so this is the only job that
    # exercises them. The hosted macOS runners are all arm64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1
      # TODO(macos): add the Tauri universal-DMG bundle build here once the
      # darwin resource fetch (scripts/fetch-resources.sh: sing-box darwin +
      # lipo) and the externalBin/notarization caveat are resolved. See
      # docs/porting/macos.md; kept out for now to keep this job fast and
      # network-light.
