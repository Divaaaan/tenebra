    - name: Verify frozen inputs stayed identical
      if: ${{ always() && steps.source_before.outcome == 'success' }}
      timeout-minutes: 2
      run: |
        python3 - after <<'PY'
        """This file is embedded verbatim into the single public validation workflow."""
        import hashlib
        import io
        import json
        import os
        from pathlib import Path, PurePosixPath
        import re
        import stat
        import subprocess
        import sys
        import tarfile

        SOURCE_SHA = 'a92021606f1ca10c7f7740dccfe24d67a808ec9a4c8891a47eabaacee36ef945'
        GO_SHA = '71f7cc3875c85f1b137af6edfbc3dc904beab0453ad665b62cf07da72fe8e0d6'
        CONTROLS = {'.github/workflows/gui-build-only.yml', '.github/ci/gui-build-source.json'}

        def safe_relative(name):
            p = PurePosixPath(name)
            if not name or '\\' in name or ':' in name or p.is_absolute() or str(p) != name:
                raise ValueError('unsafe source path')
            if any(part in ('.', '..', '.git') for part in p.parts):
                raise ValueError('unsafe source component')
            return name

        def normalized_archive(names, contents):
            stream = io.BytesIO()
            with tarfile.open(fileobj=stream, mode='w', format=tarfile.PAX_FORMAT) as archive:
                for name in names:
                    info = tarfile.TarInfo(name)
                    info.size = len(contents[name])
                    info.mode = 0o644
                    info.mtime = 0
                    archive.addfile(info, io.BytesIO(contents[name]))
            return stream.getvalue()

        def prove_snapshot(root, manifest, tracked):
            root = root.resolve()
            rows = manifest['files']
            names = [safe_relative(row['path']) for row in rows]
            if len(names) != len(set(names)):
                raise ValueError('duplicate manifest path')
            if set(tracked) != set(names) | CONTROLS:
                raise ValueError('tracked tree differs from frozen payload plus two CI controls')
            contents = {}
            for row in rows:
                path = root / row['path']
                if not path.resolve().is_relative_to(root) or not stat.S_ISREG(path.lstat().st_mode):
                    raise ValueError('source path is not an owned regular file')
                content = path.read_bytes()
                if len(content) != row['bytes'] or hashlib.sha256(content).hexdigest() != row['sha256']:
                    raise ValueError('source file bytes changed: ' + row['path'])
                contents[row['path']] = content
            go_paths = [safe_relative(name) for name in manifest['go_paths']]
            if len(go_paths) != len(set(go_paths)) or not set(go_paths) <= set(names):
                raise ValueError('invalid Go archive membership')
            source = normalized_archive(names, contents)
            go = normalized_archive(go_paths, contents)
            if hashlib.sha256(source).hexdigest() != manifest['source_archive_sha256']:
                raise ValueError('normalized source archive mismatch')
            if hashlib.sha256(go).hexdigest() != manifest['go_archive_sha256']:
                raise ValueError('normalized Go archive mismatch')
            return {'source_archive_sha256': hashlib.sha256(source).hexdigest(),
                    'go_archive_sha256': hashlib.sha256(go).hexdigest(),
                    'source_archive_bytes': len(source), 'go_archive_bytes': len(go),
                    'source_files': len(names), 'go_files': len(go_paths)}

        def main():
            root = Path.cwd()
            stage = sys.argv[1]
            if stage not in ('before', 'after'):
                raise ValueError('invalid proof stage')
            manifest_path = root / '.github/ci/gui-build-source.json'
            manifest = json.loads(manifest_path.read_text('utf-8'))
            if manifest['source_archive_sha256'] != SOURCE_SHA or manifest['go_archive_sha256'] != GO_SHA:
                raise ValueError('unexpected frozen source identity')
            if len(manifest['files']) != 954 or len(manifest['go_paths']) != 590:
                raise ValueError('unexpected snapshot size')
            if manifest['go_baseline343_sha256'] != '1ef38188e18c82a0b392ffe822638dbf842981b7ef795b0e1f3ede2bb24e3984':
                raise ValueError('unexpected reviewed Go baseline')
            if manifest['go_changed_since343'] != [
                'adapters/internal/maintenancehost/host_test.go',
                'core/control/core_audit_regression_test.go',
                'core/control/nodecheck_test.go',
                'internal/installtx/journal_test.go',
                'internal/installtx/service_host_loop_linux_test.go',
            ]:
                raise ValueError('unexpected reviewed Go test-only delta')
            tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').rstrip('\0').split('\0')
            commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
            if not re.fullmatch('[0-9a-f]{40}', commit) or commit != os.environ['GITHUB_SHA']:
                raise ValueError('checkout does not match the actual published candidate commit')
            result = prove_snapshot(root, manifest, tracked)
            result.update(published_commit=commit, run_id=os.environ.get('GITHUB_RUN_ID'),
                          run_attempt=os.environ.get('GITHUB_RUN_ATTEMPT'), stage=stage,
                          workflow_sha256=hashlib.sha256((root / '.github/workflows/gui-build-only.yml').read_bytes()).hexdigest(),
                          public_manifest_sha256=hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
                          go_baseline343_sha256=manifest['go_baseline343_sha256'],
                          go_changed_since343=manifest['go_changed_since343'],
                          baseline_note='Go archive exactness is verified here; baseline343 delta comes from reviewed native provenance.',
                          unsigned_build_only=True, native_install_or_hardware_acceptance=False)
            proof = Path(os.environ['PROOF_DIR'])
            proof.mkdir(parents=True, exist_ok=True)
            (proof / ('source-proof-' + stage + '.json')).write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
            (proof / 'source-files.sha256').write_text(''.join(row['sha256'] + '  ' + row['path'] + '\n' for row in manifest['files']), encoding='utf-8')
            (proof / 'gui-build-source.json').write_bytes(manifest_path.read_bytes())
            print(json.dumps(result))

        if __name__ == '__main__':
            main()

        PY
