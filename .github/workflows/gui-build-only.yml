name: Verify immutable Ubuntu GUI artifact from producer37d
'on':
  push:
    branches:
    - ci/tenebra-gui-a9202160
permissions:
  contents: read
  actions: read
concurrency:
  group: tenebra-gui-build-a9202160
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Divaaaan/tenebra' && github.ref == 'refs/heads/ci/tenebra-gui-a9202160' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOMAXPROCS: '3'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout exact verifier without persisting credentials
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Initialize an owned proof directory after runner allocation
      timeout-minutes: 1
      run: |
        set -euo pipefail
        proof_path="${RUNNER_TEMP:?}/tenebra-gui-proof"
        test ! -e "$proof_path"
        mkdir -m 700 "$proof_path"
        printf 'PROOF_DIR=%s\n' "$proof_path" >> "$GITHUB_ENV"
    - name: Verify all frozen payload bytes and actual verifier identity
      id: source_before
      timeout-minutes: 2
      run: |
        python3 - before <<'PY'
        """This file is embedded verbatim into the single public validation workflow."""
        import hashlib
        import io
        import json
        import os
        from pathlib import Path, PurePosixPath
        import re
        import stat
        import subprocess
        import sys
        import tarfile

        SOURCE_SHA = 'a92021606f1ca10c7f7740dccfe24d67a808ec9a4c8891a47eabaacee36ef945'
        GO_SHA = '71f7cc3875c85f1b137af6edfbc3dc904beab0453ad665b62cf07da72fe8e0d6'
        CONTROLS = {'.github/workflows/gui-build-only.yml', '.github/ci/gui-build-source.json'}

        def safe_relative(name):
            p = PurePosixPath(name)
            if not name or '\\' in name or ':' in name or p.is_absolute() or str(p) != name:
                raise ValueError('unsafe source path')
            if any(part in ('.', '..', '.git') for part in p.parts):
                raise ValueError('unsafe source component')
            return name

        def normalized_archive(names, contents):
            stream = io.BytesIO()
            with tarfile.open(fileobj=stream, mode='w', format=tarfile.PAX_FORMAT) as archive:
                for name in names:
                    info = tarfile.TarInfo(name)
                    info.size = len(contents[name])
                    info.mode = 0o644
                    info.mtime = 0
                    archive.addfile(info, io.BytesIO(contents[name]))
            return stream.getvalue()

        def prove_snapshot(root, manifest, tracked):
            root = root.resolve()
            rows = manifest['files']
            names = [safe_relative(row['path']) for row in rows]
            if len(names) != len(set(names)):
                raise ValueError('duplicate manifest path')
            if set(tracked) != set(names) | CONTROLS:
                raise ValueError('tracked tree differs from frozen payload plus two CI controls')
            contents = {}
            for row in rows:
                path = root / row['path']
                if not path.resolve().is_relative_to(root) or not stat.S_ISREG(path.lstat().st_mode):
                    raise ValueError('source path is not an owned regular file')
                content = path.read_bytes()
                if len(content) != row['bytes'] or hashlib.sha256(content).hexdigest() != row['sha256']:
                    raise ValueError('source file bytes changed: ' + row['path'])
                contents[row['path']] = content
            go_paths = [safe_relative(name) for name in manifest['go_paths']]
            if len(go_paths) != len(set(go_paths)) or not set(go_paths) <= set(names):
                raise ValueError('invalid Go archive membership')
            source = normalized_archive(names, contents)
            go = normalized_archive(go_paths, contents)
            if hashlib.sha256(source).hexdigest() != manifest['source_archive_sha256']:
                raise ValueError('normalized source archive mismatch')
            if hashlib.sha256(go).hexdigest() != manifest['go_archive_sha256']:
                raise ValueError('normalized Go archive mismatch')
            return {'source_archive_sha256': hashlib.sha256(source).hexdigest(),
                    'go_archive_sha256': hashlib.sha256(go).hexdigest(),
                    'source_archive_bytes': len(source), 'go_archive_bytes': len(go),
                    'source_files': len(names), 'go_files': len(go_paths)}

        def main():
            root = Path.cwd()
            stage = sys.argv[1]
            if stage not in ('before', 'after'):
                raise ValueError('invalid proof stage')
            manifest_path = root / '.github/ci/gui-build-source.json'
            manifest = json.loads(manifest_path.read_text('utf-8'))
            if manifest['source_archive_sha256'] != SOURCE_SHA or manifest['go_archive_sha256'] != GO_SHA:
                raise ValueError('unexpected frozen source identity')
            if len(manifest['files']) != 954 or len(manifest['go_paths']) != 590:
                raise ValueError('unexpected snapshot size')
            if manifest['go_baseline343_sha256'] != '1ef38188e18c82a0b392ffe822638dbf842981b7ef795b0e1f3ede2bb24e3984':
                raise ValueError('unexpected reviewed Go baseline')
            if manifest['go_changed_since343'] != [
                'adapters/internal/maintenancehost/host_test.go',
                'core/control/core_audit_regression_test.go',
                'core/control/nodecheck_test.go',
                'internal/installtx/journal_test.go',
                'internal/installtx/service_host_loop_linux_test.go',
            ]:
                raise ValueError('unexpected reviewed Go test-only delta')
            tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').rstrip('\0').split('\0')
            commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
            if not re.fullmatch('[0-9a-f]{40}', commit) or commit != os.environ['GITHUB_SHA']:
                raise ValueError('checkout does not match the actual published candidate commit')
            result = prove_snapshot(root, manifest, tracked)
            result.update(published_commit=commit, run_id=os.environ.get('GITHUB_RUN_ID'),
                          run_attempt=os.environ.get('GITHUB_RUN_ATTEMPT'), stage=stage,
                          workflow_sha256=hashlib.sha256((root / '.github/workflows/gui-build-only.yml').read_bytes()).hexdigest(),
                          public_manifest_sha256=hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
                          go_baseline343_sha256=manifest['go_baseline343_sha256'],
                          go_changed_since343=manifest['go_changed_since343'],
                          baseline_note='Go archive exactness is verified here; baseline343 delta comes from reviewed native provenance.',
                          unsigned_build_only=True, native_install_or_hardware_acceptance=False)
            proof = Path(os.environ['PROOF_DIR'])
            proof.mkdir(parents=True, exist_ok=True)
            (proof / ('source-proof-' + stage + '.json')).write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
            (proof / 'source-files.sha256').write_text(''.join(row['sha256'] + '  ' + row['path'] + '\n' for row in manifest['files']), encoding='utf-8')
            (proof / 'gui-build-source.json').write_bytes(manifest_path.read_bytes())
            print(json.dumps(result))

        if __name__ == '__main__':
            main()

        PY
    - name: Set up the exact helper compiler
      timeout-minutes: 8
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version-file: .go-version
        cache: false
        check-latest: false
    - name: Set up Node for the unchanged source payload builder
      timeout-minutes: 5
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Record verifier toolchains
      timeout-minutes: 1
      run: |
        set -euo pipefail
        {
          go version
          node --version
          python3 --version
          gh --version
        } > "$PROOF_DIR/verifier-tool-versions.txt"
        test "$(go version | awk '{print $3}')" = "go$(cat .go-version)"
    - name: Verify immutable producer and reproduce only its packaged helper
      id: verify_artifact
      timeout-minutes: 10
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 -  <<'PY'
        """Verify one immutable producer artifact; never run an installer or helper."""
        import hashlib
        import io
        import json
        import os
        from pathlib import Path, PurePosixPath
        import re
        import shutil
        import stat
        import subprocess
        import tarfile
        import tempfile
        import zipfile

        REPOSITORY = 'Divaaaan/tenebra'
        PRODUCER_RUN = 43027623219
        PRODUCER_COMMIT = '37d27393490a464f1360c3fc9fc166ba80f03830'
        PRODUCER_WORKFLOW_SHA = '7fc201c9c3eac830ee812b9a400c5ac3954f186e3fa4454fca3ece07e8ae116d'
        ARTIFACT_ID = 13860321019
        ARTIFACT_DIGEST = '0a66c1b1773985a07e13d441f6b6750a2baaeec15e3180254fa347f6d25bcac2'
        DEB_DIGEST = '13aa055f289f844673e57db031a1be6c0ab5d701786a032715cef0d6ab4a42f8'
        HELPER_DIGEST = '5ee2c1ef8e2b19f3dd380f622c6a814aec0e22c01707007bdbfdfb9b6dda458d'
        SOURCE_DIGEST = 'a92021606f1ca10c7f7740dccfe24d67a808ec9a4c8891a47eabaacee36ef945'
        GO_DIGEST = '71f7cc3875c85f1b137af6edfbc3dc904beab0453ad665b62cf07da72fe8e0d6'
        RECEIPT_PINS = {
            'source-proof-before.json': 'b1f8cb7522e480efa5e63050eed644f3d796a1919a1516b42136481f0cd7428c',
            'source-proof-after.json': '2c266d27fbb93196f0c1baf2e85860063991edf24605bd0547ca2cd73b2671cb',
            'core-buildinfo.json': 'c4e506a717e62933ff0b363edeb182ab27d8f512b7b683e471b2440738ed6b30',
            'core-buildinfo.txt': '9b9803305afaac0221ab6b8cdda404bb955329e9e3e9a873ba9da61f79900a51',
            'compiled-core.sha256': '47f019af166ef247fc84eedb75935da0c4e24cf24bb9cfc0f9813606a20ed001',
            'go-race.jsonl': '412717ae28c16dd455222c2fcd58ccb5c557dbb1e8cacba3d3e81a7ccceababc',
            'go-race-summary.json': '5ecf0de98bba210df4e681aa6b2e0350d40d62d2190be521f85dfcd3cc8a043f',
            'gui-build-source.json': '32a647af1f79c0dba83f6d28a8ab0bfa86166b5bdc8e73dc2205ea739b25dac8',
            'source-files.sha256': '42ad18fa5f06a87a46044399216fffab19cce8e2a4b41e473a3cb351662412a1',
            'tool-versions.txt': '2fec957da8445ec7b0856ef7d35169c33768924dd223f56547c08463e8c04279',
        }
        ROLES = {'geoip-ru.srs', 'geosite-ads.srs', 'geosite-ru.srs', 'sing-box', 'tenebra-core'}
        EXPECTED_FAILED_STEP = 'Verify compiled helper binding and unsigned package hashes'

        def sha(path):
            digest = hashlib.sha256()
            with path.open('rb') as stream:
                for data in iter(lambda: stream.read(1048576), b''):
                    digest.update(data)
            return digest.hexdigest()

        def require(condition, message):
            if not condition:
                raise ValueError(message)

        def validate_producer(run, jobs, artifact):
            require(run['id'] == PRODUCER_RUN and run['head_sha'] == PRODUCER_COMMIT, 'producer identity mismatch')
            require(run['event'] == 'push' and run['run_attempt'] == 1, 'unexpected producer event or attempt')
            require(run['status'] == 'completed' and run['conclusion'] == 'failure', 'unexpected producer conclusion')
            require(run['repository']['full_name'] == REPOSITORY, 'producer repository mismatch')
            require(len(jobs['jobs']) == 1, 'unexpected producer job fanout')
            steps = jobs['jobs'][0]['steps']
            require([s['name'] for s in steps if s['conclusion'] == 'failure'] == [EXPECTED_FAILED_STEP], 'producer contains a different failure')
            for name in ['Verify all frozen payload bytes and actual candidate identity', 'Fresh source-bound Go race suite',
                         'Compile and verify the exact committed Go core', 'Build unsigned GUI and locally compiled bound helper',
                         'Verify frozen inputs stayed identical']:
                require(any(s['name'] == name and s['conclusion'] == 'success' for s in steps), 'producer stage not successful: ' + name)
            require(artifact['id'] == ARTIFACT_ID and not artifact['expired'], 'artifact identity/expiry mismatch')
            require(artifact['digest'] == 'sha256:' + ARTIFACT_DIGEST, 'artifact digest mismatch')
            require(artifact['workflow_run']['id'] == PRODUCER_RUN and artifact['workflow_run']['head_sha'] == PRODUCER_COMMIT, 'artifact producer link mismatch')
            require(artifact['size_in_bytes'] <= 80 * 1024**2, 'unexpected artifact size')

        def unpack_zip(archive_path, destination):
            require(sha(archive_path) == ARTIFACT_DIGEST, 'downloaded artifact bytes mismatch')
            with zipfile.ZipFile(archive_path) as archive:
                entries = archive.infolist()
                require(len(entries) <= 100 and sum(r.file_size for r in entries) <= 256 * 1024**2, 'artifact expansion limit')
                seen = set()
                for row in entries:
                    name = PurePosixPath(row.filename)
                    require(not name.is_absolute() and '..' not in name.parts and '\\' not in row.filename and ':' not in row.filename, 'unsafe artifact path')
                    require(row.filename not in seen and not stat.S_ISLNK(row.external_attr >> 16), 'duplicate or linked artifact entry')
                    seen.add(row.filename)
                    target = destination / row.filename
                    require(target.resolve().is_relative_to(destination.resolve()), 'artifact path escapes temporary root')
                    if row.is_dir():
                        target.mkdir(parents=True, exist_ok=True)
                        continue
                    target.parent.mkdir(parents=True, exist_ok=True)
                    with archive.open(row) as source, target.open('xb') as output:
                        shutil.copyfileobj(source, output, 1048576)

        def verify_receipts(artifact_root, current_manifest):
            files = {}
            for name, digest in RECEIPT_PINS.items():
                candidates = list(artifact_root.rglob(name))
                require(len(candidates) == 1 and sha(candidates[0]) == digest, 'producer receipt bytes mismatch: ' + name)
                files[name] = candidates[0]
            require(files['gui-build-source.json'].read_bytes() == current_manifest.read_bytes(), 'producer and verifier frozen manifests differ')
            for stage in ['before', 'after']:
                evidence = json.loads(files['source-proof-' + stage + '.json'].read_text())
                require(evidence['published_commit'] == PRODUCER_COMMIT and evidence['run_id'] == str(PRODUCER_RUN) and evidence['run_attempt'] == '1', 'source proof producer mismatch')
                require(evidence['stage'] == stage and evidence['workflow_sha256'] == PRODUCER_WORKFLOW_SHA, 'producer workflow/stage mismatch')
                require(evidence['source_archive_sha256'] == SOURCE_DIGEST and evidence['go_archive_sha256'] == GO_DIGEST, 'producer frozen source mismatch')
                require(evidence['source_files'] == 954 and evidence['go_files'] == 590, 'producer source membership mismatch')
            summary = json.loads(files['go-race-summary.json'].read_text())
            counts = {'test_pass': 0, 'test_fail': 0, 'test_skip': 0, 'package_pass': 0, 'package_fail': 0, 'invalid_json_lines': 0}
            skips = []
            for line in files['go-race.jsonl'].read_text('utf-8').splitlines():
                if not line.strip():
                    continue
                event = json.loads(line)
                action = event.get('Action')
                if action not in ['pass', 'fail', 'skip']:
                    continue
                kind = 'test' if event.get('Test') else 'package'
                if kind + '_' + action in counts:
                    counts[kind + '_' + action] += 1
                if kind == 'test' and action == 'skip':
                    skips.append({'package': event.get('Package'), 'test': event['Test']})
            require(summary['exit_code'] == 0 and summary['passed'] is True and summary['counts'] == counts and summary['skipped_tests'] == skips, 'race receipt does not match actual JSON events')
            require(counts == {'test_pass': 2192, 'test_fail': 0, 'test_skip': 56, 'package_pass': 28, 'package_fail': 0, 'invalid_json_lines': 0}, 'unexpected producer race coverage')
            core = json.loads(files['core-buildinfo.json'].read_text())
            require(core['revision'] == PRODUCER_COMMIT and core['goVersion'] == '1.26.8' and core['os'] == 'linux' and core['arch'] == 'amd64', 'core build receipt identity mismatch')
            require(files['compiled-core.sha256'].read_text().split()[0] == core['sha256'], 'producer core digest receipts differ')
            return files, summary, core

        def extract_deb(deb, destination):
            require(sha(deb) == DEB_DIGEST, 'immutable Debian artifact mismatch')
            raw = deb.read_bytes()
            require(raw[:8] == b'!<arch>\n', 'invalid Debian ar header')
            offset = 8
            content = None
            while offset < len(raw):
                header = raw[offset:offset + 60]
                require(len(header) == 60 and header[58:60] == b'`\n', 'invalid Debian ar member')
                size = int(header[48:58])
                offset += 60
                require(0 <= size <= 200 * 1024**2 and offset + size <= len(raw), 'Debian member exceeds bounds')
                name = header[:16].decode().strip().rstrip('/')
                if name.startswith('data.tar'):
                    require(content is None, 'duplicate Debian payload archive')
                    content = raw[offset:offset + size]
                offset += size + size % 2
            require(content is not None, 'Debian data archive missing')
            wanted = {'usr/lib/tenebra/tenebra-helper': 'packaged-helper',
                      'usr/lib/tenebra/package-payload/payload.json': 'payload.json'}
            wanted.update({'usr/lib/tenebra/package-payload/' + name: name for name in ROLES})
            found = {}
            with tarfile.open(fileobj=io.BytesIO(content), mode='r|*') as archive:
                for row in archive:
                    name = row.name.removeprefix('./')
                    if name not in wanted:
                        continue
                    require(row.isfile() and name not in found and row.size <= 128 * 1024**2, 'invalid or duplicate packaged role')
                    target = destination / wanted[name]
                    with archive.extractfile(row) as source, target.open('xb') as output:
                        shutil.copyfileobj(source, output, 1048576)
                    found[name] = target
            require(set(found) == set(wanted), 'packaged helper or payload role missing')
            payload = json.loads((destination / 'payload.json').read_text())
            require(payload['source_sha'] == PRODUCER_COMMIT and payload['target'] == 'linux-amd64', 'packaged payload source mismatch')
            require({r['name'] for r in payload['files']} == ROLES and len(payload['files']) == 5, 'packaged role membership mismatch')
            for row in payload['files']:
                path = destination / row['name']
                require(path.stat().st_size == row['size'] and sha(path) == row['sha256'], 'packaged payload file hash mismatch')
            require(sha(destination / 'packaged-helper') == HELPER_DIGEST, 'packaged helper differs from immutable producer')
            return payload

        def gh_read(endpoint, output=None):
            args = ['gh', 'api', '--hostname', 'github.com', endpoint]
            if output is None:
                run = subprocess.run(args, capture_output=True, timeout=45)
            else:
                with output.open('xb') as stream:
                    run = subprocess.run(args, stdout=stream, stderr=subprocess.PIPE, timeout=90)
            # Do not write auth headers or a redirect's temporary signed query to artifacts.
            if run.returncode != 0:
                # Persist status only: CLI stderr may contain a signed redirect URL.
                status = re.search(rb'HTTP\s+(\d{3})', run.stderr or b'')
                code = int(status.group(1)) if status else None
                error = {'endpoint': endpoint, 'exit_code': run.returncode, 'http_status': code,
                         'classification': 'artifact_read_http_failure' if code else 'artifact_read_transport_or_cli_failure',
                         'product_test_failure': False}
                (Path(os.environ['PROOF_DIR']) / 'artifact-read-error.json').write_text(json.dumps(error, indent=2), encoding='utf-8')
                raise ValueError('GitHub artifact read failed; HTTP ' + str(code) if code else 'GitHub artifact read transport/CLI failure')
            return json.loads(run.stdout) if output is None else None

        def verify_rebuilt_stage(stage, roles):
            require(sha(stage / 'tenebra-helper') == sha(roles / 'packaged-helper') == HELPER_DIGEST, 'source-rebuilt helper is not byte-identical to packaged producer helper')
            require((stage / 'payload/payload.json').read_bytes() == (roles / 'payload.json').read_bytes(), 'rebuilt payload manifest differs from immutable Debian package')
            binding = json.loads((stage / 'binding.json').read_text())
            for key, path in {'helper_sha256': stage / 'tenebra-helper', 'helper_blob_sha256': stage / 'helper.gz',
                              'payload_sha256': stage / 'payload/payload.json', 'payload_archive_sha256': stage / 'payload.tar.gz'}.items():
                require(binding[key] == sha(path), 'reconstructed stage binding mismatch')
            rows = []
            for role in sorted(ROLES):
                require(sha(stage / 'payload' / role) == sha(roles / role), 'rebuilt role differs from Debian package')
                rows.append({'role': role, 'bytes': (roles / role).stat().st_size, 'sha256': sha(roles / role)})
            return binding, rows

        def main():
            root = Path.cwd()
            proof = Path(os.environ['PROOF_DIR'])
            verifier = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
            require(verifier == os.environ['GITHUB_SHA'] and re.fullmatch('[0-9a-f]{40}', verifier), 'verifier checkout identity mismatch')
            version = (root / '.go-version').read_text().strip()
            require(subprocess.check_output(['go', 'version'], text=True).split()[2] == 'go' + version == 'go1.26.8', 'actual helper compiler mismatch')
            run = gh_read('repos/' + REPOSITORY + '/actions/runs/' + str(PRODUCER_RUN))
            jobs = gh_read('repos/' + REPOSITORY + '/actions/runs/' + str(PRODUCER_RUN) + '/jobs')
            artifact = gh_read('repos/' + REPOSITORY + '/actions/artifacts/' + str(ARTIFACT_ID))
            validate_producer(run, jobs, artifact)
            with tempfile.TemporaryDirectory(prefix='tenebra-immutable-verify-', dir=proof.parent) as temporary:
                temp = Path(temporary)
                archive = temp / 'producer.zip'
                gh_read('repos/' + REPOSITORY + '/actions/artifacts/' + str(ARTIFACT_ID) + '/zip', archive)
                unpacked = temp / 'artifact'
                unpacked.mkdir()
                unpack_zip(archive, unpacked)
                receipts, summary, core_receipt = verify_receipts(unpacked, root / '.github/ci/gui-build-source.json')
                debs = list(unpacked.rglob('*.deb'))
                require(len(debs) == 1, 'unexpected Debian artifact count')
                roles = temp / 'roles'
                roles.mkdir()
                payload = extract_deb(debs[0], roles)
                require(sha(roles / 'tenebra-core') == core_receipt['sha256'], 'packaged core differs from source-built producer core')
                helper_info = subprocess.check_output(['go', 'version', '-m', str(roles / 'packaged-helper')], text=True)
                require('go1.26.8' in helper_info.splitlines()[0] and '/cmd/tenebra-helper' in helper_info and 'CGO_ENABLED=0' in helper_info and 'GOOS=linux' in helper_info and 'GOARCH=amd64' in helper_info and '-trimpath=true' in helper_info, 'packaged helper toolchain/target mismatch')
                core_info = subprocess.check_output(['go', 'version', '-m', str(roles / 'tenebra-core')], text=True)
                stage = temp / 'rebuilt-stage'
                # Unchanged frozen builder performs the real source-bound Go compilation.
                node = r'''
        import { execFileSync } from 'node:child_process';
        import { readFileSync } from 'node:fs';
        import { prepareServicePayload } from './scripts/prepare-service-payload.mjs';
        import { verifyBuildInfo } from './scripts/verify-core-build.mjs';
        const [input, core, output, sourceSha, version] = process.argv.slice(1);
        const info = execFileSync('go', ['version', '-m', core], { encoding: 'utf8' });
        verifyBuildInfo(info, { goVersion: readFileSync('.go-version', 'utf8').trim(), revision: sourceSha, os: 'linux', arch: 'amd64' });
        await prepareServicePayload({ input, core, output, target: 'linux-amd64', version, sourceSha });
        '''
                build_env = {key: value for key, value in os.environ.items() if key not in ['GH_TOKEN', 'GITHUB_TOKEN']}
                cache = temp / 'fresh-go-build-cache'
                cache.mkdir()
                build_env.update(GOCACHE=str(cache), GOAMD64='v1')
                with (proof / 'helper-rebuild.stdout.log').open('wb') as stdout, (proof / 'helper-rebuild.stderr.log').open('wb') as stderr:
                    subprocess.run(['node', '--input-type=module', '-e', node, str(roles), str(roles / 'tenebra-core'), str(stage), PRODUCER_COMMIT, payload['version']],
                                   cwd=root, env=build_env, stdout=stdout, stderr=stderr, check=True, timeout=360)
                binding, rows = verify_rebuilt_stage(stage, roles)
                rebuilt_info = subprocess.check_output(['go', 'version', '-m', str(stage / 'tenebra-helper')], text=True, env=build_env)
                (proof / 'source-rebuilt-helper-buildinfo.txt').write_text(rebuilt_info, encoding='utf-8')
                for name, path in receipts.items():
                    shutil.copyfile(path, proof / ('producer-' + name))
                (proof / 'packaged-helper-buildinfo.txt').write_text(helper_info, encoding='utf-8')
                (proof / 'packaged-core-buildinfo.txt').write_text(core_info, encoding='utf-8')
                shutil.copyfile(stage / 'binding.json', proof / 'reconstructed-stage-binding.json')
                shutil.copyfile(roles / 'payload.json', proof / 'verified-payload-manifest.json')
                shutil.copyfile(debs[0], proof / debs[0].name)
                result = {'verifier_commit': verifier, 'verifier_run_id': os.environ['GITHUB_RUN_ID'],
                          'producer_commit': PRODUCER_COMMIT, 'producer_run_id': PRODUCER_RUN, 'producer_artifact_id': ARTIFACT_ID,
                          'producer_artifact_sha256': ARTIFACT_DIGEST, 'producer_workflow_sha256': PRODUCER_WORKFLOW_SHA,
                          'frozen_source_sha256': SOURCE_DIGEST, 'go_source_sha256': GO_DIGEST, 'actual_helper_compiler': 'go' + version,
                          'packaged_helper_sha256': HELPER_DIGEST, 'source_rebuilt_helper_sha256': sha(stage / 'tenebra-helper'),
                          'packaged_core_sha256': sha(roles / 'tenebra-core'), 'deb_sha256': sha(debs[0]), 'payload_roles': rows,
                          'reconstructed_stage_binding': binding, 'producer_race_reused': summary,
                          'reconstructed_stage_is_original_unretained_archive': False,
                          'helper_build_recipe': 'unchanged nativePorts.buildHelper: -mod=readonly -p2 -trimpath -buildvcs=false, CGO_ENABLED=0, linux/amd64, pinned Go1.26.8',
                          'fresh_isolated_go_build_cache': True,
                          'gui_rebuilt_in_verifier': False, 'race_reran_in_verifier': False,
                          'helper_compiled_from_frozen_source_in_verifier': True, 'helper_executed': False, 'deb_installed': False,
                          'linux_contract': 'package-manager trust; source identity verified by byte-identical helper rebuild, not Darwin-release globals',
                          'signing_or_release_authorization': False, 'native_or_hardware_acceptance': False}
                (proof / 'immutable-artifact-verification.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
                (proof / 'verified-files.sha256').write_text(HELPER_DIGEST + '  packaged-and-source-rebuilt-helper\n' + sha(debs[0]) + '  ' + debs[0].name + '\n' + ''.join(row['sha256'] + '  ' + row['role'] + '\n' for row in rows), encoding='utf-8')
                print(json.dumps({'producer_commit': PRODUCER_COMMIT, 'verifier_commit': verifier, 'verified_original_deb_sha256': sha(debs[0]),
                                  'source_rebuilt_helper_sha256': HELPER_DIGEST, 'producer_race_pass': 2192, 'producer_race_skip': 56, 'gui_rebuilt': False}))

        if __name__ == '__main__':
            main()

