            (proof / 'source-files.sha256').write_text(''.join(row['sha256'] + '  ' + row['path'] + '\n' for row in manifest['files']), encoding='utf-8')
            (proof / 'gui-build-source.json').write_bytes(manifest_path.read_bytes())
            print(json.dumps(result))

        if __name__ == '__main__':
            main()

        PY
    - name: Retain exact build provenance and available diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: tenebra-gui-linux-a9202160-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/tenebra-gui-proof/
          ui-desktop/src-tauri/target/release/bundle/deb/*.deb
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        include-hidden-files: false
