# JVM args for the Gradle daemon. 2 GB is enough for this single-module build;
# raise it if a large tenebra.aar pushes R8/desugaring over the limit.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX is required; the legacy support library is not used anywhere.
android.useAndroidX=true
# Per-module R classes only — smaller and faster, and the project relies on it.
android.nonTransitiveRClass=true

kotlin.code.style=official
